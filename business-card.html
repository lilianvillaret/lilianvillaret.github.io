<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Визитка — Lilian Villaret</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Raleway:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f5f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 60px;
    padding: 40px 20px;
    font-family: 'Raleway', sans-serif;
  }

  h2 {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #999;
    margin-bottom: -40px;
  }

  .card {
    width: 90mm;
    height: 50mm;
    border-radius: 4mm;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.1);
    position: relative;
  }

  /* === FRONT === */
  .front {
    background-image: url('business-card-bg.jpg');
    background-size: cover;          /* фото без искажений, кадр чуть правее */
    background-position: 70% 30%;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0;
  }

  .front::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(
      180deg,
      rgba(0,0,0,0.10) 0%,
      rgba(0,0,0,0.03) 35%,
      rgba(0,0,0,0.45) 100%
    );
    z-index: 1;
  }

  .front-content {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 5mm 6mm;
  }

  .livi-sign {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 28px;
    color: rgba(255,255,255,0.85);
    letter-spacing: 2px;
  }

  .front-bottom {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1.5mm;
    margin-top: auto;
  }

  .painting-label {
    font-family: 'Raleway', sans-serif;
    font-weight: 400;
    font-size: 6.5px;
    color: rgba(255,255,255,0.92);
    letter-spacing: 1px;
    text-align: right;
  }

  .slogan-front {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 9px;
    color: rgba(255,255,255,0.9);
    letter-spacing: 1.5px;
    text-align: right;
  }

  /* === BACK === */
  .back {
    background: #fefdfb;
    display: flex;
    flex-direction: row;
    padding: 5mm 5mm 5mm 6mm;
    gap: 4mm;
  }

  .back-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .back-right {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    margin-right: 3mm;       /* сдвиг QR чуть влево */
  }

  .name-back {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 16px;
    color: #2a2a2a;
    letter-spacing: 1px;
    line-height: 1.2;
  }

  .role {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 7.5px;
    color: #888;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 1.5mm;
  }

  .manifesto {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 9px;
    color: #555;
    line-height: 1.5;
    margin-top: 2.5mm;
    border-left: 1.5px solid rgba(255,255,255,0.85);
    padding-left: 2.5mm;
  }

  .services {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 7px;
    color: #999;
    letter-spacing: 0.8px;
    margin-top: 4mm;          /* перечисление чуть выше */
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
  }

  .services span {
    position: relative;
    padding-left: 3mm;
  }

  .services span::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.5em;
    width: 0.8mm;
    height: 0.8mm;
    border-radius: 50%;
    background: #A78BFA;
  }

  .contacts {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 0.8mm;
  }

  .contact-line {
    font-family: 'Raleway', sans-serif;
    font-weight: 400;
    font-size: 7px;
    color: #1a1a1a;
    letter-spacing: 0.5px;
  }

  .contact-line b {
    font-weight: 400;
    color: #555;
  }

  .qr-placeholder {
    width: 18mm;
    height: 18mm;
    border: 1px solid #e0ddd8;
    border-radius: 2mm;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf9f7;
  }

  .qr-placeholder svg {
    width: 14mm;
    height: 14mm;
    opacity: 0.7;
  }

  .qr-label {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 5.5px;
    color: #bbb;
    text-align: center;
    margin-top: 1mm;
    letter-spacing: 0.5px;
  }

  /* === PRINT HELPERS === */
  .card-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .label {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 11px;
    color: #bbb;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Gold accent line */
  .gold-line {
    width: 12mm;
    height: 0.3px;
    background: rgba(255,255,255,0.85);
    margin: 1.5mm 0;
    opacity: 0.6;
  }

  @media print {
    body { background: white; gap: 20mm; }
    .card { box-shadow: none; border: 0.5px solid #ddd; }
    h2, .label { display: none; }
  }
</style>
</head>
<body>

<h2>Lilian Villaret &mdash; Business Card</h2>

<!-- FRONT -->
<div class="card-wrapper">
  <div class="label">front</div>
  <div class="card front">
    <div class="front-content">
      <div class="front-bottom">
        <div class="painting-label">&laquo;Ванильное море&raquo; &mdash; серия &laquo;Архив снов&raquo;</div>
      </div>
    </div>
  </div>
</div>

<!-- BACK -->
<div class="card-wrapper">
  <div class="label">back</div>
  <div class="card back">
    <div class="back-left">
      <div>
        <div class="name-back">Лилиан Вилларе</div>
        <div class="role">Художник-абстракционист</div>
        <div class="gold-line"></div>
        <div class="manifesto">Придаю чувствам форму.<br>Вы ощущаете &mdash; я проявляю</div>
        <div class="services">
          <span>интерьерные картины</span>
          <span>кастомизация</span>
          <span>открытки с фразами-трансформами</span>
        </div>
      </div>
      <div class="contacts">
        <div class="contact-line">+7 (900) 500-80-13</div>
      </div>
    </div>
    <div class="back-right">
      <div>
        <div class="qr-placeholder">
          <img src="qr-site.svg" style="width: 14mm; height: 14mm;" alt="QR">
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
