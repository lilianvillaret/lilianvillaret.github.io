<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наклейки для полки — Lilian Villaret</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e4f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    gap: 40px;
    font-family: 'Inter', sans-serif;
  }

  .section-label {
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8878A8;
    margin-top: 20px;
  }

  .row {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* === БАЗОВЫЙ СТИКЕР "Мини-картину можно взять просто так" === */
  .sticker {
    width: 70mm;
    height: 45mm;
    border-radius: 3mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2mm;
    padding: 4mm;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(90, 77, 120, 0.12);
  }

  .sticker::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #A78BFA, #7DD3FC, transparent);
  }
  .sticker::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #7DD3FC, #A78BFA, transparent);
  }

  .st-icon { font-size: 20px; margin-bottom: 1mm; }
  .st-main {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: 16px;
    text-align: center;
    line-height: 1.4;
  }
  .st-sub {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 7px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 1mm;
  }

  /* Светлый вариант */
  .st-light { background: #F0EDFA; }
  .st-light .st-icon { color: #A78BFA; }
  .st-light .st-main { color: #150D2E; }
  .st-light .st-sub  { color: #8878A8; }

  /* Тёмный вариант */
  .st-dark { background: #150D2E; }
  .st-dark .st-icon { color: #7DD3FC; }
  .st-dark .st-main { color: #F0EDFA; }
  .st-dark .st-sub  { color: #A78BFA; }

  @media print {
    body { background: white; }
    .section-label { display: none; }
    .sticker { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="section-label">Наклейка-призыв: бесплатные мини-картины (7 &times; 4.5 см)</div>
<div class="row">
  <div class="sticker st-light">
    <div class="st-icon">&#10022;</div>
    <div class="st-main">Мини-картину<br>можно взять просто так</div>
    <div class="st-sub">Lilian Villaret</div>
  </div>

  <div class="sticker st-dark">
    <div class="st-icon">&#10022;</div>
    <div class="st-main">Мини-картину<br>можно взять просто так</div>
    <div class="st-sub">Lilian Villaret</div>
  </div>
</div>

</body>
</html>
